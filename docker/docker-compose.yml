services:    
  web-development:
    container_name: web_development
    image: web-dev
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../src:/var/www/html
    ports:
      - "8080:80"
    restart: always
    depends_on:
      - database
    networks:
      - private-network 
  database:
    container_name: database
    image: mariadb:lts-ubi9
    volumes:
      - ./database:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - private-network
  
  phpmyadmin:
    container_name: phpmyadmin
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: database
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8082:80"
    restart: always
    depends_on:
      - database
    networks:
      - private-network

networks:
  private-network: